ci:
  collect:
    url:
      - "http://localhost:3000/login"
      - "http://localhost:3000/register"
    numberOfRuns: 2
    settings:
      chromeFlags: "--no-sandbox --disable-dev-shm-usage"

  assert:
    # Gate on category scores only. The lighthouse:no-pwa preset would also
    # assert every individual audit at a perfect score, which is not the policy.
    assertions:
      categories:performance:
        - warn
        - minScore: 0.75
      categories:accessibility:
        - error
        - minScore: 0.90
      categories:best-practices:
        - warn
        - minScore: 0.85
      categories:seo:
        - warn
        - minScore: 0.80

  upload:
    target: temporary-public-storage
