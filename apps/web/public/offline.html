<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline · SocialHub</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0a0a;
        color: #ededed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1.5rem;
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin-bottom: 1.5rem;
        opacity: 0.6;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 0.95rem;
        color: #888;
        max-width: 340px;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      button {
        background: #ededed;
        color: #0a0a0a;
        border: none;
        border-radius: 9999px;
        padding: 0.65rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }

      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <svg
      class="icon"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3 3l18 18M8.288 8.303A5.978 5.978 0 006 12a6 6 0 0012 0 5.978 5.978 0 00-1.506-3.97M10.5 10.5a3 3 0 014.243 4.243M16.5 16.5L21 21M3 3l4.5 4.5"
      />
    </svg>

    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection. Check your network and
      try again.
    </p>

    <button onclick="window.location.reload()">Try again</button>

    <script>
      // Auto-reload once the network comes back
      window.addEventListener("online", () => window.location.reload())
    </script>
  </body>
</html>
