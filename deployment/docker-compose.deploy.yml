version: "3.8"

# Deploys the social-platform stack on the same Docker network as Open WebUI
# so the worker can call open-webui:8080 for embeddings.

services:
  # ── Infrastructure ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openfang

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: social_platform_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_platform
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 100
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openfang

  redis:
    image: redis:7-alpine
    container_name: social_platform_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - sp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openfang

  # ── Database Migration (runs once then exits) ──
  migrate:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
      target: migrate
    container_name: social_platform_migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_platform
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_platform
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - openfang

  # ── Next.js Web App ──
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
    container_name: social_platform_web
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/social_platform
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_platform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-super-secret-change-me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3080}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      SOCKET_SERVER_URL: http://socket:3001
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      EMBEDDING_API_URL: http://open-webui:8080/api/v1/embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openfang

  # ── Socket.IO Server ──
  socket:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.socket
    container_name: social_platform_socket
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-super-secret-change-me}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - openfang

  # ── BullMQ Worker (emails, mentions, embeddings, scheduled posts) ──
  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
    container_name: social_platform_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/social_platform
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_platform
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      EMBEDDING_API_URL: http://open-webui:8080/api/v1/embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openfang

volumes:
  sp_postgres_data:
  sp_redis_data:

networks:
  openfang:
    external: true
    name: openfang-1_default
