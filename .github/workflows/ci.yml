name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Typecheck, Lint, Unit Tests
  # ─────────────────────────────────────────────────────────
  ci:
    name: Type Check, Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: social_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_platform_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Prisma migrations
        run: pnpm --filter web prisma migrate deploy

      - name: Run unit tests
        run: pnpm test

  # ─────────────────────────────────────────────────────────
  # Job 2: E2E Tests (Playwright)
  # ─────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: social_platform_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_platform_e2e
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-e2e-secret
      NEXTAUTH_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter web prisma generate

      - name: Run migrations & seed
        run: |
          pnpm --filter web prisma migrate deploy
          pnpm db:seed

      - name: Build web app
        run: pnpm --filter web build
        env:
          TMDB_READ_ACCESS_TOKEN: stub
          NEXT_PUBLIC_MAPBOX_TOKEN: ""
          RESEND_API_KEY: stub
          CLOUDINARY_CLOUD_NAME: stub
          CLOUDINARY_API_KEY: stub
          CLOUDINARY_API_SECRET: stub
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: stub

      - name: Start web app
        run: pnpm --filter web start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # Job 3: Lighthouse CI (Performance & Accessibility)
  # ─────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: social_platform_lhci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_platform_lhci
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-lhci-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client & migrate
        run: |
          pnpm --filter web prisma generate
          pnpm --filter web prisma migrate deploy

      - name: Build web app
        run: pnpm --filter web build
        env:
          TMDB_READ_ACCESS_TOKEN: stub
          NEXT_PUBLIC_MAPBOX_TOKEN: ""
          RESEND_API_KEY: stub
          CLOUDINARY_CLOUD_NAME: stub
          CLOUDINARY_API_KEY: stub
          CLOUDINARY_API_SECRET: stub
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: stub

      - name: Start web app
        run: pnpm --filter web start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14
